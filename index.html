const { useState, useEffect } = React;

const API_BASE = 'https://cruiseship-watch-backend.onrender.com';

// ── TW helpers ────────────────────────────────────────────────────────────────

const toTitleCase = (str) => {
  if (!str) return '';
  return str.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
};

const smartTitleCase = (str) => {
  if (!str) return '';
  return toTitleCase(str.trim());
};

// State Dept advisory level → display style. 1=green safest, 4=red do not travel.
const advisoryLevelStyle = (level) => {
  if (level === 4) return { border: '#7f1d1d', headerBg: '#991b1b', cardBg: 'rgba(127,29,29,0.55)', label: 'Level 4: Do Not Travel' };
  if (level === 3) return { border: '#9a3412', headerBg: '#9a3412', cardBg: 'rgba(124,45,18,0.45)', label: 'Level 3: Reconsider Travel' };
  if (level === 2) return { border: '#92400e', headerBg: '#92400e', cardBg: 'rgba(120,53,15,0.40)', label: 'Level 2: Exercise Increased Caution' };
  if (level === 1) return { border: '#166534', headerBg: '#166534', cardBg: 'rgba(20,83,45,0.40)', label: 'Level 1: Exercise Normal Precautions' };
  return { border: '#52525b', headerBg: '#3f3f46', cardBg: 'rgba(63,63,70,0.35)', label: 'No advisory on file' };
};

// NOAA marine sea state → display style.
const seaStateStyle = (state) => {
  if (state === 'rough')    return { border: '#7f1d1d', headerBg: '#991b1b', cardBg: 'rgba(127,29,29,0.45)', label: 'Rough' };
  if (state === 'moderate') return { border: '#9a3412', headerBg: '#9a3412', cardBg: 'rgba(124,45,18,0.40)', label: 'Moderate' };
  if (state === 'calm')     return { border: '#166534', headerBg: '#166534', cardBg: 'rgba(20,83,45,0.35)', label: 'Calm' };
  return { border: '#52525b', headerBg: '#3f3f46', cardBg: 'rgba(63,63,70,0.30)', label: 'Unknown' };
};

// Clean HTML out of a State Dept summary (or any HTML-bearing source field).
const stripHtml = (s) => {
  if (!s) return '';
  var tmp = document.createElement('div');
  tmp.innerHTML = s;
  return (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
};

const truncateWords = (s, maxChars) => {
  if (!s) return '';
  if (s.length <= maxChars) return s;
  var cut = s.substring(0, maxChars);
  var lastSpace = cut.lastIndexOf(' ');
  if (lastSpace > maxChars - 50) cut = cut.substring(0, lastSpace);
  return cut + '…';
};

const formatRelativeTime = (iso) => {
  if (!iso) return '';
  try {
    const t = new Date(iso.replace(' ', 'T') + (iso.indexOf('Z') === -1 && iso.indexOf('+') === -1 ? 'Z' : ''));
    const diffMs = Date.now() - t.getTime();
    const min = Math.floor(diffMs / 60000);
    if (min < 1) return 'just now';
    if (min < 60) return min + ' min ago';
    const hrs = Math.floor(min / 60);
    if (hrs < 24) return hrs + ' hr ago';
    const days = Math.floor(hrs / 24);
    if (days < 30) return days + ' day' + (days === 1 ? '' : 's') + ' ago';
    return t.toLocaleDateString();
  } catch (e) { return ''; }
};

const RADIUS_PRESETS = [25, 50, 100, 250];

  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>

);

const ClearableInput = ({ value, onChange, onBlur, onKeyPress, placeholder, type='text', maxLength, inputClass, numeric }) => (
  <div className="relative">
    <input type={type} value={value} onChange={onChange} onBlur={onBlur} onKeyPress={onKeyPress} placeholder={placeholder} maxLength={maxLength} inputMode={numeric ? 'decimal' : undefined} className={inputClass + ' pr-10'} autoCorrect="off" autoCapitalize={numeric ? 'off' : undefined} spellCheck="false" />
    {value && (
      <button onClick={() => onChange({ target: { value: '' } })} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-200 hover:text-white text-xl font-bold leading-none" type="button">X</button>
    )}
  </div>
);

const CardPageHeader = ({ title, subtitle }) => (
  <div className="mb-3 pb-2 border-b border-teal-700/30 text-center">
    <h2 className="text-4xl font-black text-white tracking-wide">{title}</h2>
    {subtitle && <p className="text-teal-300 italic text-xl mt-1">{subtitle}</p>}
  </div>
);

const POSTER_STYLE = {
  backgroundColor: '#0a0a0a',
  backgroundImage: 'url(' + TW_BG + ')',
  backgroundSize: 'cover',
  backgroundPosition: 'center top',
  backgroundRepeat: 'no-repeat',
  backgroundAttachment: 'scroll',
};

const WOOD_STYLE = {
  backgroundColor: '#0a0a0a',
  backgroundImage: 'url(' + TW_BG + ')',
  backgroundSize: 'cover',
  backgroundPosition: 'center top',
  backgroundRepeat: 'no-repeat',
  backgroundAttachment: 'scroll',
  filter: 'none',
};

const PageWrapper = ({ children, bgStyle }) => {
  var bg = bgStyle || POSTER_STYLE;
  var isListPage = bg === WOOD_STYLE;
  return (
    <div style={{ minHeight: '100dvh', width: '100%', position: 'relative', paddingTop: 'env(safe-area-inset-top)', paddingBottom: '5rem', backgroundColor: bg.backgroundColor, backgroundImage: bg.backgroundImage || 'none', backgroundSize: bg.backgroundSize || 'auto', backgroundPosition: bg.backgroundPosition || 'top', backgroundRepeat: bg.backgroundRepeat || 'no-repeat', backgroundAttachment: bg.backgroundAttachment || 'scroll' }}>
      <div style={{ position: 'fixed', inset: 0, backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)', backgroundColor: isListPage ? 'rgba(10,10,10,0.55)' : 'rgba(10,10,10,0.40)', zIndex: 0 }} />
      <div style={{ position: 'relative', zIndex: 10 }}>{children}</div>
    </div>
  );
};

function App() {
  const [page, setPage] = useState('login');
  const [auth, setAuth] = useState(false);
  const [user, setUser] = useState(null);
  const [destinations, setDestinations] = useState([]);
  const [notifications, setNotifications] = useState([]);
  const [expandedAlertGroups, setExpandedAlertGroups] = useState({});
  const [loading, setLoading] = useState(false);
  const [backendWaking, setBackendWaking] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [showPassword, setShowPassword] = useState(false);
  const [newDest, setNewDest] = useState({ name: '', radius: 50 });
  const [geoQuery, setGeoQuery] = useState('');
  const [geoCandidates, setGeoCandidates] = useState([]);
  const [geoPicked, setGeoPicked] = useState(null);
  const [geoSearching, setGeoSearching] = useState(false);
  const [geoMsg, setGeoMsg] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editingName, setEditingName] = useState('');
  const [showDangerZone, setShowDangerZone] = useState(false);
  const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
  const [drawerData, setDrawerData] = useState(null);
  const [drawerLoading, setDrawerLoading] = useState(false);
  const [mapEnlarged, setMapEnlarged] = useState(false);
  const [apiVersion, setApiVersion] = useState('...');
  const [addDestMsg, setAddDestMsg] = useState('');

  // Viewport sizing
  const [viewportW, setViewportW] = useState(typeof window !== 'undefined' ? window.innerWidth : 400);
  useEffect(() => {
    const onResize = () => setViewportW(window.innerWidth);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  const isPhone = viewportW < 640;
  const isTablet = viewportW >= 640 && viewportW < 1024;

  useEffect(() => {
    fetch(API_BASE + '/health').then(r => r.json()).then(d => setApiVersion(d.version || '?')).catch(() => setApiVersion('?'));
    const t = localStorage.getItem('tw_token');
    const u = localStorage.getItem('tw_user');
    if (t && u) {
      try { setUser(JSON.parse(u)); setAuth(true); setPage('search'); loadDestinations(); loadNotifications(); }
      catch(e) { localStorage.removeItem('tw_token'); localStorage.removeItem('tw_user'); }
    }
    const handleVisibilityChange = () => {
      if (document.visibilityState === 'visible') {
        setTimeout(() => { document.querySelectorAll('input').forEach(i => i.blur()); }, 100);
      }
    };
    document.addEventListener('visibilitychange', handleVisibilityChange);
    return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
  }, []);

  const loadDestinations = async () => {
    try {
      const token = localStorage.getItem('tw_token');
      const r = await fetch(API_BASE + '/tw/destinations', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!r.ok) throw new Error('Failed');
      setDestinations(await r.json());
    } catch (e) { console.error(e); }
  };

  const loadNotifications = async () => {
    try {
      const token = localStorage.getItem('tw_token');
      const r = await fetch(API_BASE + '/tw/notifications', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!r.ok) throw new Error('Failed');
      setNotifications(await r.json());
    } catch (e) { console.error(e); }
  };

  const dismissAlert = async (notifId) => {
    const token = localStorage.getItem('tw_token');
    setNotifications(prev => prev.filter(n => n.id !== notifId));
    try { await fetch(API_BASE + '/tw/notifications/' + notifId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } }); } catch(e) {}
  };

  const doAuth = async (mode) => {
    if (!email || !password) return;
    setLoading(true);
    setBackendWaking(false);
    const wakingTimer = setTimeout(() => setBackendWaking(true), 3500);
    try {
      const r = await fetch(API_BASE + '/tw/auth/' + mode, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });
      clearTimeout(wakingTimer);
      setBackendWaking(false);
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        alert(err.detail || 'Authentication failed');
        setLoading(false);
        return;
      }
      const data = await r.json();
      localStorage.setItem('tw_token', data.access_token);
      const u = { email: email };
      localStorage.setItem('tw_user', JSON.stringify(u));
      setUser(u); setAuth(true); setPage('search');
      await loadDestinations();
      await loadNotifications();
    } catch (e) {
      clearTimeout(wakingTimer);
      setBackendWaking(false);
      alert('Network error: ' + e.message);
    }
    setLoading(false);
  };

  const doLogout = () => {
    localStorage.removeItem('tw_token');
    localStorage.removeItem('tw_user');
    setUser(null); setAuth(false); setDestinations([]); setNotifications([]);
    setPage('login');
  };

  const doDeleteAccount = async () => {
    const token = localStorage.getItem('tw_token');
    try {
      await fetch(API_BASE + '/tw/account', { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
    } catch(e) {}
    doLogout();
  };

  const doGeocode = async () => {
    setGeoMsg('');
    setGeoCandidates([]);
    setGeoPicked(null);
    var q = (geoQuery || '').trim();
    if (q.length < 2) { setGeoMsg('Type a city, country, or landmark.'); return; }
    setGeoSearching(true);
    try {
      var token = localStorage.getItem('tw_token');
      var r = await fetch(API_BASE + '/tw/geocode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ query: q })
      });
      if (!r.ok) {
        var err = await r.json().catch(function(){ return {}; });
        setGeoMsg(err.detail || 'Search failed. Try a different query.');
        setGeoSearching(false);
        return;
      }
      var data = await r.json();
      var cands = data.candidates || [];
      setGeoCandidates(cands);
      if (cands.length === 0) setGeoMsg('No matches. Try a more specific query.');
    } catch (e) {
      setGeoMsg('Network error: ' + e.message);
    }
    setGeoSearching(false);
  };

  const addDestination = async () => {
    setAddDestMsg('');
    var name = (newDest.name || '').trim();
    var radius = parseFloat(newDest.radius) || 50;
    if (!geoPicked) {
      setAddDestMsg('Search and pick a place first.');
      return;
    }
    if (!name) name = geoPicked.formatted_address.split(',')[0].trim();
    var token = localStorage.getItem('tw_token');
    try {
      var r = await fetch(API_BASE + '/tw/destinations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({
          name: name,
          lat: geoPicked.lat,
          lng: geoPicked.lng,
          country: geoPicked.country || null,
          country_code: geoPicked.country_code || null,
          formatted_address: geoPicked.formatted_address,
          radius_mi: radius,
          alert_level: 'realtime'
        })
      });
      if (!r.ok) {
        var err = await r.json().catch(function(){ return {}; });
        setAddDestMsg(err.detail || 'Failed to add place.');
        return;
      }
      setNewDest({ name: '', radius: 50 });
      setGeoQuery('');
      setGeoCandidates([]);
      setGeoPicked(null);
      setAddDestMsg('Added "' + name + '" to your watchlist.');
      await loadDestinations();
      setTimeout(function(){ setAddDestMsg(''); setPage('watchlist'); }, 900);
    } catch (e) {
      setAddDestMsg('Network error: ' + e.message);
    }
  };

  const setDestInMyDestinations = async (id, saved) => {
    // Toggles in_my_destinations flag. Never removes from Watchlist —
    // Watchlist contains ALL destinations and is the live monitor.
    var token = localStorage.getItem('tw_token');
    try {
      var r = await fetch(API_BASE + '/tw/destinations/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ in_my_destinations: saved })
      });
      if (r.ok) {
        setDestinations(function(prev) {
          return prev.map(function(d) {
            if (d.id === id) return Object.assign({}, d, { in_my_destinations: saved });
            return d;
          });
        });
      }
    } catch(e) { console.error('save to my destinations failed:', e); }
  };

  const renameDestination = async (id, name) => {
    var token = localStorage.getItem('tw_token');
    try {
      var r = await fetch(API_BASE + '/tw/destinations/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ name: name })
      });
      if (r.ok) {
        setDestinations(function(prev) {
          return prev.map(function(d) {
            if (d.id === id) return Object.assign({}, d, { name: name });
            return d;
          });
        });
      }
    } catch(e) { console.error('rename failed:', e); }
  };

  const removeDestination = async (id) => {
    var token = localStorage.getItem('tw_token');
    try {
      var r = await fetch(API_BASE + '/tw/destinations/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
      if (r.ok) {
        setDestinations(function(prev) { return prev.filter(function(d) { return d.id !== id; }); });
      }
    } catch(e) { console.error('delete failed:', e); }
  };

  const openDestinationDrawer = async (dest) => {
    setDrawerData({ destination: dest, advisory: null, outbreaks: [], marine: [] });
    setDrawerLoading(true);
    const token = localStorage.getItem('tw_token');
    try {
      const r = await fetch(API_BASE + '/tw/destinations/' + dest.id + '/signals', { headers: { 'Authorization': 'Bearer ' + token } });
      if (r.ok) {
        const data = await r.json();
        setDrawerData(data);

  const SignalsDrawer = () => {

            </div>

  // Watchlist = ALL destinations (cron monitors them all, drawer does live recheck)

  var activeDestinations = destinations;
  var savedDestinations = destinations.filter(function(d) { return d.in_my_destinations; });

  return (
    <PageWrapper bgStyle={page === 'watchlist' || page === 'destinations' || page === 'alerts' ? WOOD_STYLE : POSTER_STYLE}>

        {/* ── Search / Add Destination ────────────────────────────────── */}
        {page === 'search' && (() => {

              <div className="space-y-3">
                <ClearableInput value={geoQuery} onChange={(e) => { setGeoQuery(e.target.value); setGeoPicked(null); }} onKeyPress={(e) => e.key === 'Enter' && doGeocode()} placeholder="Paris · Cabo San Lucas · Kyoto, Japan" inputClass={iClass} />
                <button onClick={doGeocode} disabled={geoSearching} className="w-full py-3 bg-teal-600 hover:bg-teal-700 disabled:opacity-60 text-white rounded-lg flex items-center justify-center gap-2 text-xl font-bold">

                <p className="text-gray-100 text-sm text-center leading-snug">

                {geoMsg && <p className="text-teal-300 text-center text-base">{geoMsg}</p>}
                {geoCandidates.length > 0 && (

                {addDestMsg && <p className="text-teal-300 text-center text-xl">{addDestMsg}</p>}
                <p className="text-gray-100 text-base text-center leading-snug px-2 pt-2 border-t border-teal-700/30">
                  Information from U.S. State Department, World Health Organization, and NOAA.

        {page === 'watchlist' && (

                            <div className="flex items-center gap-1 mt-1"><CheckIcon /><span className="text-xl text-teal-400">Watching</span></div>

                          </div>

        {/* ── Alerts feed ───────────────────────────────────────────────── */}
        {page === 'alerts' && (

                <div className="text-center py-4">
                  <p className="text-white font-bold text-2xl">No alerts yet</p>
                  <p className="text-gray-200 text-xl mt-1">We'll notify you when a travel advisory, outbreak, or maritime alert affects a place on your watchlist.</p>

              ) : (
                <div className="space-y-3">
                  {(() => {
                    var groups = {};
                    var order = [];
                    for (var ni = 0; ni < notifications.length; ni++) {
                      var n = notifications[ni];
                      var key = n.watchlist_id || ('name:' + n.name);
                      if (!groups[key]) { groups[key] = { name: n.name, watchlist_id: n.watchlist_id, items: [], latest: n.created_at }; order.push(key); }
                      groups[key].items.push(n);
                      if (n.created_at > groups[key].latest) groups[key].latest = n.created_at;
                    }
                    return order.map(function(k) {
                      var g = groups[k];
                      var isExpanded = !!expandedAlertGroups[k];
                      var visibleItems = isExpanded ? g.items : g.items.slice(0, 1);
                      var moreCount = g.items.length - 1;
                      return (
                        <div key={k} className="p-3 bg-slate-900/50 border border-slate-800 rounded-xl">
                          <h3 className="font-bold text-white text-2xl mb-1">{g.name || 'Place'}</h3>
                          <ul className="mb-2 space-y-1">
                            {visibleItems.map(function(item) {
                              return <li key={item.id} className="text-gray-200 text-base leading-snug">• {item.message}</li>;
                            })}
                          </ul>
                          {moreCount > 0 && (
                            <button onClick={() => setExpandedAlertGroups(Object.assign({}, expandedAlertGroups, { [k]: !isExpanded }))} className="text-teal-300 text-base font-semibold underline decoration-dotted mb-2">
                              {isExpanded ? 'Show less' : ('+ ' + moreCount + ' more ' + (moreCount === 1 ? 'alert' : 'alerts'))}
                            </button>
                          )}
                          <p className="text-gray-200 text-sm mt-1 mb-2">{new Date(g.latest).toLocaleDateString()}</p>
                          <div className="flex gap-2">
                            <button onClick={() => {
                              var watchedDest = destinations.find(function(d) { return d.id === g.watchlist_id; });
                              if (watchedDest) openDestinationDrawer(watchedDest);
                            }} className="flex-1 py-2 bg-teal-700/50 border border-teal-600/50 text-white rounded-lg text-xl font-bold">View</button>
                            <button onClick={async () => {
                              for (var di = 0; di < g.items.length; di++) { try { await dismissAlert(g.items[di].id); } catch(e) {} }
                            }} className="flex-1 py-2 bg-transparent border border-slate-700/50 text-teal-400 rounded-lg text-base">
                              Dismiss<span className="block text-teal-600 text-xs leading-tight">Remove All</span>
                            </button>
                          </div>
                        </div>
                      );
                    });
                  })()}
                </div>
              )}
            </div>
          </div>
        )}

        {/* ── Info ───────────────────────────────────────────────────────── */}
        {page === 'info' && (
          <div className="space-y-4 pb-8" style={{ paddingTop: '1rem' }}>
            <div className={cardClass}>
              <div className="mb-3 pb-2 border-b border-teal-700/30 text-center">
                <h2 className="text-4xl font-black text-white tracking-wide">About</h2>
                <h2 className="text-4xl font-black text-white tracking-wide">Travel Watch</h2>
              </div>
              <p className="text-teal-300 italic text-xl text-center mb-3">v{APP_VERSION}</p>
              <div className="flex items-center gap-4 mb-4">
                <img src={BILL_PHOTO} alt="Bill Spencer" className="w-14 h-14 rounded-full object-cover border-2 border-teal-600 shadow-lg shrink-0" />
                <div>
                  <p className="font-bold text-white text-xl">Bill Spencer</p>
                  <p className="text-teal-400 italic text-xl">Founder</p>
                  <a href="mailto:hello@travelwatch.app" className="text-teal-400 text-xl mt-1 block">hello@travelwatch.app</a>
                </div>
              </div>
              <p className="text-teal-200 text-2xl font-bold italic mb-3">Watch your travels.</p>
              <div className="space-y-3 text-gray-200 text-xl leading-relaxed">
                <p>Places you're going. Places you love. Places you watch from afar.</p>
                <p>Travel conditions change. Advisories get raised, outbreaks emerge, seas get rough — and the signals are scattered across government sites, health bulletins, and weather feeds.</p>
                <p>Travel Watch brings them together: a simple way to follow the destinations you care about and get notified when something changes.</p>
                <p>Travel Watch monitors public information from government and international sources. No ads. No subscriptions. Just useful answers.</p>
              </div>
            </div>
            <div className={cardClass}>
              <h3 className="text-white text-2xl font-bold mb-4 text-center">How it works</h3>
              <div className="space-y-4">
                <div className="flex gap-3 items-start"><span className="text-teal-400 text-2xl font-black w-7 shrink-0">1.</span><p className="text-gray-100 text-xl">Add a place — city, country, or landmark. We convert this to a location for matching against advisories, outbreaks, and maritime feeds.</p></div>
                <div className="flex gap-3 items-start"><span className="text-teal-400 text-2xl font-black w-7 shrink-0">2.</span><p className="text-gray-100 text-xl">Travel Watch checks public sources every 24 hours and matches new signals to your watched destinations. Premium users will get faster checks.</p></div>
                <div className="flex gap-3 items-start"><span className="text-teal-400 text-2xl font-black w-7 shrink-0">3.</span><p className="text-gray-100 text-xl">When something happens — advisory raised, outbreak reported, seas turning rough — you'll see an alert with the type, severity, and source.</p></div>
                <div className="flex gap-3 items-start"><span className="text-teal-400 text-2xl font-black w-7 shrink-0">4.</span><p className="text-gray-100 text-xl">Travel Watch is free. Premium features may include faster check intervals, email digests, and custom filters.</p></div>
              </div>
            </div>
            <div className={cardClass}>
              <h3 className="text-white text-2xl font-bold mb-3">Data Sources</h3>
              <div className="space-y-2 text-gray-100 text-xl leading-relaxed">
                <p><strong className="text-white">U.S. State Department</strong> &mdash; Travel advisories (Levels 1–4) by country.</p>
                <p><strong className="text-white">World Health Organization</strong> &mdash; Disease Outbreak News bulletins.</p>
                <p><strong className="text-white">NOAA</strong> &mdash; High Seas Forecast for coastal destinations.</p>
              </div>
            </div>
            <div className={cardClass}>
              <h3 className="font-bold text-white mb-1 text-2xl">Privacy Policy</h3>
              <p className="text-gray-200 text-xl mb-3">Last updated: May 2026</p>
              <div className="space-y-3 text-gray-200 text-xl leading-relaxed">
                <p><strong className="text-white">We collect:</strong> your email address, your watched destinations, and anonymous usage data.</p>
                <p><strong className="text-white">Addresses are safe:</strong> When you search for a place, we send the query you typed to Google's geocoding service to convert it to coordinates. We don't store your address — only the resulting latitude/longitude, country code, and the name you give the place.</p>
                <p><strong className="text-white">How we use it:</strong> We do not sell your personal information. Ever.</p>
                <p><strong className="text-white">Data sources:</strong> Travel signals are based on public information from the U.S. State Department, the World Health Organization, and NOAA.</p>
                <p><strong className="text-white">Your rights:</strong> You may delete your account and all associated data at any time.</p>
                <p><strong className="text-white">Disclaimer:</strong> Travel information is provided for informational purposes only. Always follow guidance from local authorities and your government. Travel Watch is not a substitute for official advisories or emergency notifications.</p>
                <a href="mailto:hello@travelwatch.app" className="text-teal-400 text-xl">hello@travelwatch.app</a>
              </div>
            </div>
            {/* Try our other Watchlist apps */}
            <div className={cardClass}>
              <h3 className="text-white text-2xl font-bold mb-3 text-center">Try our other Watchlist apps</h3>
              <div className="space-y-3">
                <a href="https://3brains.app" target="_blank" rel="noopener noreferrer"
                  className="block w-full py-4 bg-teal-700 hover:bg-slate-800 text-white text-center rounded-xl text-xl font-semibold">
                  Visit Our Site
                </a>
              </div>
            </div>
            <div className="px-1 space-y-3 pb-2">
              <div className="p-3 bg-black/30 rounded-xl"><p className="font-medium text-gray-200 text-xl text-center">{user && user.email}</p></div>
              <button onClick={doLogout} className="w-full py-4 bg-teal-700 hover:bg-slate-800 text-white rounded-xl text-2xl font-bold">Sign Out</button>
              <button onClick={() => setShowDangerZone(!showDangerZone)} className="w-full py-3 text-gray-300 text-xl text-center">{showDangerZone ? 'Hide' : 'Account Removal'}</button>
              {showDangerZone && (
                <div className="space-y-3">
                  {!showDeleteConfirm
                    ? <button onClick={() => setShowDeleteConfirm(true)} className="w-full py-4 bg-slate-900/70 border border-slate-800 text-teal-400 rounded-xl text-xl">Delete Account</button>
                    : <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 space-y-3">
                        <h3 className="font-bold text-teal-400 text-xl">Are you sure?</h3>
                        <p className="text-teal-300 text-xl">This will permanently delete your account and all data.</p>
                        <button onClick={doDeleteAccount} className="w-full py-4 bg-teal-700 text-white rounded-xl font-bold text-xl">Yes, Permanently Delete My Account</button>
                        <button onClick={() => { setShowDeleteConfirm(false); setShowDangerZone(false); }} className="w-full py-4 bg-slate-800 border border-slate-600 text-gray-100 rounded-xl font-medium text-xl">Cancel</button>
                      </div>
                  }
                </div>
              )}
            </div>
            <p className="text-white/30 text-center text-sm pb-4">v{APP_VERSION}</p>
          </div>
        )}

      </div>

      {/* ── Bottom nav ───────────────────────────────────────────────────── */}
      <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, backgroundColor: 'rgba(10,10,10,0.95)', backdropFilter: 'blur(8px)', borderTop: '1px solid #0f766e', padding: '0.5rem 1rem', paddingBottom: 'max(0.5rem, env(safe-area-inset-bottom))' }}>
        <div className="flex justify-around max-w-sm mx-auto">
          <button onClick={() => setPage('search')} className={'flex flex-col items-center gap-0.5 px-1 py-1 ' + (page === 'search' ? 'text-teal-400' : 'text-gray-200')}>
            <SearchIcon /><span className="text-xl font-medium">Search</span>
          </button>
          <button onClick={() => setPage('watchlist')} className={'flex flex-col items-center gap-0.5 px-1 py-1 ' + (page === 'watchlist' ? 'text-teal-400' : 'text-gray-200')}>
            <HeartIcon /><span className="text-xl font-medium">Watchlist</span>
          </button>
          <button onClick={() => setPage('destinations')} className={'flex flex-col items-center gap-0.5 px-1 py-1 ' + (page === 'destinations' ? 'text-teal-400' : 'text-gray-200')}>
            <PinIcon />
            <span className="text-xl font-medium">My Places</span>
          </button>
          <button onClick={() => setPage('info')} className={'flex flex-col items-center gap-0.5 px-1 py-1 ' + (page === 'info' ? 'text-teal-400' : 'text-gray-200')}>
            <InfoIcon /><span className="text-xl font-medium">Info</span>
          </button>
          <button onClick={() => setPage('alerts')} className={'flex flex-col items-center gap-0.5 px-1 py-1 relative ' + (page === 'alerts' ? 'text-teal-400' : 'text-gray-200')}>
            <BellIcon red={unreadCount > 0} />
            {unreadCount > 0 && <span className="absolute top-0 right-1 bg-teal-600 text-white text-xl font-bold rounded-full w-4 h-4 flex items-center justify-center">{unreadCount > 9 ? '9+' : unreadCount}</span>}
            <span className="text-xl font-medium" style={unreadCount > 0 ? {color:'#0d9488'} : {}}>Alerts</span>
          </button>
        </div>
        <p className="text-center text-gray-600 text-xs mt-1" style={{display: page === 'search' ? 'none' : 'block'}}>app v{APP_VERSION} | api v{apiVersion}</p>
      </div>
    </PageWrapper>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
